name: MATLAB tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v2
        with:
          products: Optimization_Toolbox
      - uses: matlab-actions/run-tests@v2
        with:
          select-by-folder: tests
